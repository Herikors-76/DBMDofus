id: mansot_royal
nom: Mansot Royal
type: donjon
contenu: Excavation du Mansot Royal
niveau: 140
position: "-64,-54"
pv: "4900-7200"
etats: [Invulnérable]
sorts:
  - { nom: Mansoluble, effet: "Eau en vol de vie au contact + échange" }
  - { nom: Mansopoudrage, effet: "Si poussé/attiré pendant l'effet : ennemis à plus de 4 cases mansomnambules" }
  - { nom: Mansolénoïde, effet: "Feu = 10 % des PV manquants" }
mecaniques:
