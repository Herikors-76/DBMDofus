  - { nom: Mansodah, declencheur: mansots soignés, effet: "Déclenche Mansodah" }
strategie:
  - Soigner juste ce qu'il faut
  - Le rendre vulnérable avant que les autres monstres s'activent
alertes:
  - { quand: etat_invulnerable, texte: "Soignez un allié BLESSÉ au contact du boss", niveau: important }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/13451/donjon-excavation-mansot-royal]
