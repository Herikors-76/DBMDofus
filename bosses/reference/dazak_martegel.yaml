id: dazak_martegel
nom: Dazak Martegel
type: donjon
contenu: Brasserie du Roi Dazak
niveau: 200
position: "-62,-70"
pv: "18000-26000"
etats: [Résistances très élevées au départ, Nimpatience (stades 1 à 3)]
sorts:
  - { nom: Empalement royal, effet: "Corps à corps, neutre, 40 % d'érosion 2 tours, -10 % de résistances cumulables tout le combat" }
  - { nom: Ninflitration, effet: "Bond de 1 à 5 cases, air sur les cases adjacentes à l'arrivée" }
  - { nom: Nintrépidité, effet: "Alliés +2 PM et 1 500 de bouclier 1 tour ; tous les 2 tours dès le tour 3" }
mecaniques:
