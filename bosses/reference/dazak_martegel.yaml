  - { nom: Fenêtre de 2 tours, declencheur: stade Nimpatience 3, effet: "2 tours pour faire chuter ses résistances, puis attendre le stade 3 suivant" }
strategie:
  - Le déplacer (poussée/attirance) dès le stade 3
  - Éviter les dommages de poussée
  - Garder le Tanklume à distance (il échange avec le boss)
alertes:
  - { quand: etat_nimpatience_3, texte: "Nimpatience 3 : déplacez Dazak, 2 tours !", niveau: critique }
  - { quand: tous_les_2_tours_des_tour_3, texte: "Nintrépidité : bouclier et PM aux alliés", niveau: important }
  - { quand: corps_a_corps, texte: "Évitez de rester au contact (érosion)", niveau: important }
