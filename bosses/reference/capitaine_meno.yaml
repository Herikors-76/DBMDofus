id: capitaine_meno
nom: Capitaine Méno
type: donjon
contenu: Vaisseau du Capitaine Méno
niveau: 200
position: "24,27"
pv: "40000-60000"
sorts:
  - { nom: Crystalisation, effet: "1 à 10 PO, eau, glyphe sous la cible : si elle commence son tour dessus, +1 000 bouclier et feu sur les alliés alignés" }
  - { nom: Matière Volatile, effet: "1 à 4 PO, air" }
mecaniques:
  - { nom: Vagues, declencheur: chaque tour, effet: "Monstres invulnérables qui disparaissent après 3 tours ; inutile de les tuer" }
  - { nom: Puissance croissante, declencheur: chaque tour, effet: "+20 % de puissance pour vos persos" }
strategie:
  - Temporiser (retraits, poussées), le boss a beaucoup de PV
  - Ne pas être aligné avec un allié au début de son tour
  - Repousser/entraver les monstres invulnérables
alertes:
  - { quand: debut_tour_joueur, texte: "Pas aligné avec un allié (glyphe Cristal)", niveau: critique }
  - { quand: chaque_tour, texte: "Ignorez les monstres invulnérables, éloignez-les", niveau: info }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/14645/vaisseau-capitaine-meno]
