id: ush_galesh
nom: Ush Galesh
type: donjon
contenu: Plateau de Ush (dimension Écaflipus)
niveau: 160
position: "7,-3 (Écaflipus)"
pv: "4000-5500 (×2)"
boss: [Ush Trèfle Rouge, Ush Trèfle Noir]
sorts:
  - { nom: Négativisme (Rouge), effet: "Transfère les états Rouge/Noir à l'autre Ush" }
  - { nom: Éclair Rouge (Rouge), effet: "Feu en ligne 1 à 12 PO, -résistances" }
  - { nom: Pulsation Malsaine, effet: "Rouge : feu autour, poussée de 3. Noir : neutre en croix, attire au contact" }
  - { nom: Frappe Noire (Noir), effet: "Terre au contact, -3 PM" }
mecaniques:
  - { nom: État Rouge, declencheur: permanent, effet: "Touchable seulement au contact" }
  - { nom: État Noir, declencheur: permanent, effet: "Touchable seulement à distance (2 PO et plus)" }
  - { nom: Bascule, declencheur: chaque coup, effet: "L'Ush touché change d'état" }
strategie:
  - Alterner contact et distance selon l'état
  - Prévoir fuite/placement (ils taclent fort)
alertes:
  - { quand: etat_change, texte: "Rouge = contact, Noir = distance", niveau: important }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/13274/plateau-ush]
