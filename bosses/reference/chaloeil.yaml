  - { quand: debut_tour, tours: [21], texte: "Tour 21 : le Chaloeil est vulnérable !", niveau: critique }
  - { quand: tous_les_3_tours, texte: "Gros Yeux : vérifiez les cases", niveau: important }
  - { quand: tous_les_5_tours, texte: "Nouvelle vague", niveau: info }
