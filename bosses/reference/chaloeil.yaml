id: chaloeil
nom: Chaloeil
type: donjon
contenu: Défi du Chaloeil
niveau: 200
position: "-9,-22 (Écaflipus)"
pv: "15000-22000"
etats: [Invulnérable jusqu'au tour 21]
sorts:
  - { nom: Toilette Écaflip, effet: "Gros dégâts eau, 1 à 2 PO en ligne, poussée de 3, -4 PM" }
  - { nom: Farce et Attrape, effet: "Gros dégâts terre, 1 à 6 PO, échange de position + Pesanteur, 3 fois par tour" }
  - { nom: Gros Yeux, effet: "Tous les 3 tours : bonus selon la case (1 : +200 esquive PM, 2 : +5 PO, 3 : Indéplaçable, 4 : +3 PM, 5 : soin, 6 : +600 puissance)" }
mecaniques:
  - { nom: Dés et glyphes, declencheur: fin du tour du Chaloeil, effet: "Dés (obstacles) et glyphes blancs (soin) sur les cases de même numéro" }
  - { nom: Effet de case, declencheur: monstre sur une case de même valeur qu'un perso, effet: "200 à 300 neutre + 20 % d'érosion au perso" }
  - { nom: Vagues, declencheur: tous les 5 tours, effet: "5 vagues ; la suivante arrive dès que la précédente est vidée" }
strategie:
  - Lui retirer des PM, le bloquer dans un coin
  - Se soigner sur les glyphes blancs
alertes:
