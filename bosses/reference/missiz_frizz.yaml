id: missiz_frizz
nom: Missiz Frizz
type: donjon
contenu: Forgefroide de Missiz Frizz
niveau: 200
position: "-70,-81 (Château du Comte)"
pv: "13000-19000"
etats: [Invulnérable sauf après une poussée de congère]
sorts:
  - { nom: Sang froid, effet: "1 à 4 PO, gros feu + eau en vol de vie" }
  - { nom: Glace trop physique, effet: "1 à 8 PO, feu + air (35 % des PV érodés), 20 % d'érosion" }
  - { nom: Cristallisation, effet: "+3 PM 1 tour" }
mecaniques:
  - { nom: Congères, declencheur: début de votre tour, effet: "Glyphes de congères autour de votre perso" }
  - { nom: Poussée des congères, declencheur: déplacement sur une congère, effet: "Poussée +1 et pousse les entités alignées/diagonales jusqu'à 6 PO ; le monstre poussé est vulnérable 1 tour" }
  - { nom: Intaclable, declencheur: un tour sur deux, effet: "Vous êtes Intaclable" }
  - { nom: Dégâts croissants, declencheur: perte de PV de Frizz, effet: "Ses dommages augmentent" }
strategie:
  - Rester loin d'elle
  - Se placer avant de marcher sur une congère
  - L'éroder
alertes:
  - { quand: aucun_monstre_vulnerable, texte: "Rendez un monstre vulnérable avant de frapper", niveau: critique }
  - { quand: avant_deplacement, texte: "Congère : vérifiez l'alignement", niveau: important }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/14657/forgefroide-missiz-frizz]
