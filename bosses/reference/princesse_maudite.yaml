id: princesse_maudite
nom: Princesse Maudite
type: raid_guilde
contenu: Sanctuaire des Jardins éternels (boss final)
joueurs: { max: 4 }
etats_permanents: [Lourd, Inérodable, "Invulnérable au corps à corps"]
esquive_pm: 350
phases:
  - id: 1
    pv: 50000
    seuil_pv: 1
  - id: 2
    invulnerable_jusqu_a: 2 Incantations Florales reçues
    double_jeu: true
    invocations:
      - { nom: Volonté de la Reine, pv: 30000, pm: 10, esquive_pm: 130, note: "Invulnérable jusqu'à la fin de son 1er tour ; Lien Familial si la Princesse est vulnérable" }
fleur_maudite:
  pv: 10000
  seuil_pv: 1
  degats_subis: "+20 %"
  hitbox_cases: 4
  regle: Seuil atteint = soin complet et passage dans VOTRE camp pendant 2 tours ; chaque tour, soigne son camp de 1 200 et donne +300 puissance / +10 % critique ; Insoignable sans effet ; les zones ne la touchent qu'une fois
  phase_2: En revenant chez la Princesse, elle pose des glyphes violets
mecaniques:
  - nom: Aura Maudite
    declencheur: début du tour de la Princesse, dès le tour 2
    effet: Les persos dans sa ligne de vue deviennent Statues (passent leur tour) et sont tués au début de son tour suivant ; un coup d'arme sur la statue lève la malédiction
    parade: Casser sa ligne de vue (les invocations ne sont pas pétrifiées)
  - nom: Invocations
    declencheur: tous les 2 tours
    effet: Monstre aléatoire qui la suit
  - nom: Floraison
    regle: +1 cumul par sort de dégâts ; à 10, Tempête Florale puis retour à 0
  - nom: Incantation Florale
    effet: Glyphe sur la bordure centrale quand la Fleur est dans son camp ; qui marche dessus reçoit le sort (2 PA, 10 PO, sans ligne de vue, usage unique). Sur la Princesse 2 fois = fin de l'invulnérabilité ; sur un allié = -1 tour d'envoûtement et bouclier de 200 % du niveau
sorts:
  - { nom: Appel du Protecteur, effet: "Invoque Dahliane/Tritulipe/Muguégide/Fracamélia ; relance 2 tours" }
  - { nom: Drainfecte, effet: "650 feu en vol de vie, vole 1 PO 2 tours ; portée 10, 4 fois par tour" }
  - { nom: Florigine, effet: "Fleur chez elle : 1 050 air en vol de vie en croix de taille 4, -3 PA. Fleur chez vous : 10 % d'érosion + 1 050 air ; portée 12" }
  - { nom: Maléfissure, effet: "-1 tour d'envoûtement, 900 terre en étoile de taille 2, poussée de 4 ignorant les états d'immobilisation" }
  - { nom: Purifiction, effet: "Retire Enraciné/Pesanteur/Indéplaçable, +1 PM, échange de place, 400 air ; dès le tour 2" }
  - { nom: Roncitron, effet: "900 eau en croix de taille 4, attire vers le centre ; portée 12" }
  - { nom: Tempête Florale, effet: "À 10 Floraison : 10 % d'érosion 2 tours, gros dégâts à tous ; en phase 2, +100 % critique 2 tours et soin de 10 000" }
strategie:
  - Phase 1 : tuer l'invocation, déclencher le seuil de la Fleur, la coincer dans un coin
  - Phase 2 : tuer la Volonté d'abord, puis 2 Incantations sur la Princesse
  - Hors de sa ligne de vue au début de chacun de ses tours
  - Réduction de soins (Leçon de Grunob) contre le soin de Tempête Florale
  - "Variante autowin : retrait de PM total (2 retraits ≥ 300, Éliotrope, Ouginak/Crâ pour l'esquive, Pandawa placeur en dernier)"
alertes:
  - { quand: { evenement: avant_tour_boss, tours_min: 2 }, texte: "Aura Maudite : sortez de sa ligne de vue !", niveau: critique }
  - { quand: { evenement: jauge, jauge: Floraison, valeur: 9 }, texte: "Floraison 9/10 : Tempête Florale au prochain sort", niveau: critique }
  - { quand: { evenement: etat_joueur, etat: Statue }, texte: "Statue : un coup d'arme pour le libérer", niveau: critique }
  - { quand: { evenement: tous_les_n_tours, n: 2 }, texte: "Invocation : nettoyez", niveau: info }
jauges_a_suivre: [Floraison]
fiabilite: source_unique
sources: [https://www.dofuspourlesnoobs.com/sanctuaire-des-jardins-eternels.html]
