  - { nom: Folie, declencheur: 2+ échanges avec le même allié, effet: "Vos Folies augmentent" }
strategie:
  - Se cacher (obstacles, monstres, invocations)
  - Klûtiste en premier, puis Shokkoth
alertes:
  - { quand: fin_tour_joueur, texte: "Hors de la ligne de vue de la Larve", niveau: critique }
  - { quand: degats_monstre, texte: "Pas 2 échanges avec le même monstre", niveau: important }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/14667/temple-koutoulou]
