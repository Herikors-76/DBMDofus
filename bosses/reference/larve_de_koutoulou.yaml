id: larve_de_koutoulou
nom: Larve de Koutoulou
type: donjon
contenu: Temple de Koutoulou
niveau: 200
position: "27,26"
pv: "18000-26000"
sorts:
  - { nom: Frappe Koutonienne, effet: "Corps à corps, gros dégâts terre, augmente la Folie" }
  - { nom: Permutation Inquiétante, effet: "1 à 6 PO, échange avec un allié ; 2 fois par tour dès le tour 2" }
mecaniques:
