id: phossile
nom: Phossile
type: donjon
contenu: Galerie du Phossile (dimension Énutrosor)
niveau: 150
position: "-2,-3 (Énutrosor)"
pv: "8600-12000"
sorts:
  - { nom: Roc Phorreur, effet: "Poussée de 2, terre" }
  - { nom: Phorce, effet: "2 lignes neutres : une fixe (~300), une qui grossit quand il perd des PV" }
  - { nom: Bain de lave, effet: "Désenvoûte 2 tours puis feu en zone" }
  - { nom: Épicentre, effet: "Eau jusqu'à 7 cases, attire autour de la cible" }
mecaniques:
