  - { nom: Abîme, declencheur: "tours 5, 9, 13…", effet: "Tue tous les persos dans un cercle de 4" }
strategie:
  - Rester loin des monstres
  - Le finir vite (Phorce grossit)
alertes:
  - { quand: debut_tour, tours_cycle: { depart: 5, pas: 4 }, texte: "Abîme : sortez du cercle de 4 !", niveau: critique }
  - { quand: fin_tour_joueur, texte: "Pas sur un glyphe rouge", niveau: important }
fiabilite: source_unique
sources: [https://dofus.jeuxonline.info/article/14132/galerie-phossile]
