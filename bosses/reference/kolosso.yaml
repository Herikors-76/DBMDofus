id: kolosso
nom: Kolosso
type: donjon
contenu: Cavernes du Kolosso
niveau: 190
position: "-61,-69"
pv: "8000-12000"
etats: [Invulnérable sauf après dégâts d'une invocation]
sorts:
  - { nom: Razepoutine, effet: "Depuis le contact, gros dégâts terre en cône infini" }
  - { nom: Baïkal, effet: "+50 dommages" }
  - { nom: Illyana, effet: "Sur un allié : attire de 2 et soigne" }
mecaniques:
